<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 420" role="img" aria-label="自绘纸质插画：带旗帜的神轿">
  <rect width="400" height="420" fill="#f7f4ea"/>
  <rect x="14" y="14" width="372" height="392" fill="none" stroke="#e2dccb"/>
  <circle cx="200" cy="212" r="126" fill="none" stroke="#ddd6c4" stroke-width="1" stroke-dasharray="2 8"/>

  <g stroke="#2c2e2a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
    <!-- 旗杆与旗 -->
    <path d="M302 96 L302 330" stroke-width="6"/>
    <path d="M302 108 L214 108 L232 134 L214 160 L302 160 Z" fill="#b0563f"/>
    <g fill="none" stroke="#f6f1e3" stroke-width="2.5">
      <path d="M248 128 q10 -12 20 0 q10 12 20 0"/>
      <path d="M248 144 q10 -12 20 0 q10 12 20 0"/>
    </g>
    <circle cx="302" cy="96" r="6" fill="#c9b07a"/>

    <!-- 轿顶 -->
    <path d="M112 256 Q200 194 288 256 L288 272 L112 272 Z" fill="#c9b07a"/>
    <path d="M112 256 Q104 244 92 248 Q104 260 104 272 L112 272 Z" fill="#c9b07a"/>
    <path d="M288 256 Q296 244 308 248 Q296 260 296 272 L288 272 Z" fill="#c9b07a"/>
    <path d="M200 196 L200 176" stroke-width="4"/>
    <circle cx="200" cy="170" r="7" fill="#a63a2b"/>

    <!-- 轿身 -->
    <rect x="138" y="272" width="124" height="62" fill="#b0563f"/>
    <rect x="168" y="284" width="64" height="38" fill="#f6f1e3"/>
    <g fill="none" stroke="#a8755e" stroke-width="2">
      <path d="M180 300 q10 -12 20 0 q10 12 20 0"/>
      <path d="M180 312 q10 -12 20 0 q10 12 20 0"/>
    </g>

    <!-- 轿杠 -->
    <path d="M86 300 L314 300" stroke-width="8"/>
    <path d="M86 312 L314 312" stroke-width="8"/>
    <path d="M138 342 L138 360" stroke-width="6"/>
    <path d="M262 342 L262 360" stroke-width="6"/>

    <!-- 底座 -->
    <rect x="126" y="334" width="148" height="12" fill="#2c2e2a"/>
    <rect x="164" y="346" width="72" height="8" fill="#46503f"/>
  </g>

  <!-- 轿角流苏 -->
  <g stroke="#a63a2b" stroke-width="2.5" fill="none" stroke-linecap="round">
    <path d="M120 274 q-8 16 2 24"/>
    <path d="M132 274 q-6 16 2 22"/>
    <path d="M280 274 q8 16 -2 24"/>
    <path d="M268 274 q6 16 -2 22"/>
  </g>

  <!-- 香火气 -->
  <g fill="none" stroke="#b9b3a1" stroke-width="2" stroke-linecap="round">
    <path d="M200 158 q-8 -12 2 -22 q8 -8 2 -18"/>
  </g>

  <g fill="none" stroke="#bdb6a3" stroke-width="1.6" stroke-linecap="round">
    <path d="M62 372 q-16 -14 -30 -2"/>
    <path d="M338 372 q16 -14 30 -2"/>
  </g>
  <circle cx="72" cy="100" r="3.5" fill="#9aa88f"/>
</svg>
