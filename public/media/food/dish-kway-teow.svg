<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="叠放的粿条薄片与切条刀">
  <rect width="480" height="300" fill="#2d3d31"/>
  <circle cx="230" cy="150" r="120" fill="#38483a" opacity=".55"/>
  <!-- steamed sheets -->
  <g stroke="#e8e3d4" stroke-width="3.5" fill="#3f503b">
    <path d="M92 196l84-34 152 26-84 36z"/>
    <path d="M108 172l76-30 138 24-76 32z"/>
    <path d="M124 150l68-26 124 22-68 28z"/>
  </g>
  <g stroke="#93a58f" stroke-width="2.5" fill="none">
    <path d="M122 152l68-26"/>
    <path d="M198 158l66-25"/>
    <path d="M110 176l76-30"/>
  </g>
  <!-- knife -->
  <g transform="rotate(-12 300 120)">
    <rect x="286" y="66" width="132" height="26" rx="4" fill="#38483a" stroke="#e8e3d4" stroke-width="3.5"/>
    <path d="M286 92h96l-18 40h-78z" fill="#3f503b" stroke="#f04a3a" stroke-width="3.5"/>
    <path d="M286 92h96" stroke="#e8e3d4" stroke-width="3"/>
  </g>
  <!-- cut strips -->
  <g stroke="#f04a3a" stroke-width="3" fill="#3f503b" stroke-linecap="round">
    <path d="M148 214v34"/>
    <path d="M170 224v34"/>
    <path d="M192 232v34"/>
    <path d="M214 240v32"/>
  </g>
  <!-- rice grains -->
  <g fill="#93a58f">
    <ellipse cx="352" cy="212" rx="9" ry="5" transform="rotate(-20 352 212)"/>
    <ellipse cx="372" cy="226" rx="9" ry="5" transform="rotate(10 372 226)"/>
    <ellipse cx="344" cy="238" rx="9" ry="5" transform="rotate(30 344 238)"/>
  </g>
</svg>
