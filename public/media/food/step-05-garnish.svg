  <path d="M96 148h216c0 60-50 96-108 96S96 208 96 148z" fill="#3f503b" stroke="#e8e3d4" stroke-width="4"/>
  <ellipse cx="204" cy="148" rx="108" ry="24" fill="#2d3d31" stroke="#e8e3d4" stroke-width="4"/>
  <ellipse cx="204" cy="148" rx="86" ry="16" fill="#38483a" stroke="#93a58f" stroke-width="3"/>
  <g fill="#38483a" stroke="#f04a3a" stroke-width="3">
    <path d="M158 144c16-14 42-14 54 0-14 12-38 12-54 0z"/>
    <path d="M206 140c16-14 42-14 54 0-14 12-38 12-54 0z"/>
  </g>
  <!-- sprinkle -->
  <g fill="#e8e3d4" opacity=".8">
