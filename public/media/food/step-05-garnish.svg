    <circle cx="192" cy="142" r="2.5"/>
    <circle cx="212" cy="134" r="3"/>
    <circle cx="230" cy="140" r="2.5"/>
    <circle cx="246" cy="136" r="2.5"/>
    <circle cx="204" cy="150" r="2"/>
  </g>
  <g fill="#f04a3a" opacity=".8">
    <circle cx="186" cy="152" r="2"/>
    <circle cx="222" cy="152" r="2"/>
    <circle cx="238" cy="148" r="2"/>
  </g>
  <!-- small dishes -->
  <g>
    <ellipse cx="358" cy="128" rx="42" ry="16" fill="#3f503b" stroke="#e8e3d4" stroke-width="3.5"/>
    <ellipse cx="358" cy="126" rx="28" ry="9" fill="#38483a"/>
    <text x="330" y="160" font-family="system-ui, sans-serif" font-size="13" fill="#e8e3d4">南姜末</text>
  </g>
  <g>
    <ellipse cx="384" cy="196" rx="42" ry="16" fill="#3f503b" stroke="#e8e3d4" stroke-width="3.5"/>
