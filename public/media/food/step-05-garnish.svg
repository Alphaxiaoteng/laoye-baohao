<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 300" role="img" aria-label="步骤五：在南姜末、芹菜珠、胡椒粉、蒜头油、麻油上淋热汤">
  <rect width="480" height="300" fill="#2d3d31"/>
  <g opacity=".5" fill="#38483a"><circle cx="222" cy="154" r="114"/></g>
